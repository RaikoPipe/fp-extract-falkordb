services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  chainlit:
    build: .
    command: chainlit run src/falkordb_harness/chainlit_app.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # All auth/email/admin env vars (CHAINLIT_AUTH_SECRET, REGISTER_ENABLED,
    # SMTP_*, FIRST_ADMIN_*, APP_BASE_URL, etc.) are loaded from .env.
    # For public deployment, place this behind a TLS-terminating reverse
    # proxy (e.g. Caddy/nginx) so JWT cookies travel over HTTPS only.
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=falkordb
    volumes:
      - ./data:/app/data
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      # Chainlit serves the UI on /. A 200 from the root path means the
      # HTTP server is up and serving. Use --fail so curl exits non-zero
      # on any non-2xx response.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  falkordb_data: