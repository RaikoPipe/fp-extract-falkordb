services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  chainlit:
    build: .
    command: chainlit run src/falkordb_harness/chainlit_app.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Secrets are loaded literally (no ${} interpolation) from .env.secrets
    # via env_file, so values containing $, /, @, etc. survive intact.
    # Create .env.secrets from .env.example (secret vars marked below) and
    # keep it out of git (.gitignore already excludes .env*).
    env_file:
      - path: .env.secrets
        required: false
    # Non-secret config uses explicit ${VAR:-default} passthrough, so only
    # the vars listed here reach the container — an accidental value added
    # to the host .env is NOT auto-leaked. Values are substituted by Compose
    # from the host environment / .env file.
    # For public deployment, place this behind a TLS-terminating reverse
    # proxy (e.g. Caddy/nginx) so JWT cookies travel over HTTPS only.
    environment:
      # --- FalkorDB connection (host overridden to the compose service) ---
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_GRAPH=${FALKORDB_GRAPH:-factory_planning}

      # --- LLM / embeddings (Ollama OpenAI-compatible endpoint) ---
      - LLM_MODEL=${LLM_MODEL:-glm-5.2:cloud}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-https://ollama.com}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-http://localhost:11434}
      - VECTOR_DIM=${VECTOR_DIM:-1024}

      # --- Document ingestion / preprocessing ---
      - DATA_DIR=${DATA_DIR:-./data}
      - ORIGINALS_DIR=${ORIGINALS_DIR:-./data/originals}
      - PREPROCESSED_DIR=${PREPROCESSED_DIR:-./data/preprocessed}
      - DOCPREP_YAML=${DOCPREP_YAML:-}
      - DOCPREP_FALLBACK_PROVIDER=${DOCPREP_FALLBACK_PROVIDER:-}
      - DOCPREP_FALLBACK_MODEL=${DOCPREP_FALLBACK_MODEL:-}
      - DOCPREP_FALLBACK_BASE_URL=${DOCPREP_FALLBACK_BASE_URL:-}
      - INGEST_CHUNK_SIZE=${INGEST_CHUNK_SIZE:-4000}
      - INGEST_OVERLAP=${INGEST_OVERLAP:-200}
      - INGEST_CONCURRENCY=${INGEST_CONCURRENCY:-4}

      # --- Merge mode + reconciliation ---
      - MERGE_MODE=${MERGE_MODE:-overwrite}
      - RECON_ENABLE=${RECON_ENABLE:-false}
      - RECONCILIATIONS_LOG=${RECONCILIATIONS_LOG:-./data/reconciliations.jsonl}
      - RECON_COSINE_CUTOFF=${RECON_COSINE_CUTOFF:-0.70}
      - RECON_CONFIDENCE_THRESHOLD=${RECON_CONFIDENCE_THRESHOLD:-0.90}
      - RECON_TOP_K=${RECON_TOP_K:-10}

      # --- LangChain deep-agent harness ---
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-glm-5.2:cloud}
      - AGENT_LLM_TEMPERATURE=${AGENT_LLM_TEMPERATURE:-0.0}
      - AGENT_MAX_TOOL_REPEATS=${AGENT_MAX_TOOL_REPEATS:-}

      # --- Logging ---
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - LOG_ATTACHMENTS=${LOG_ATTACHMENTS:-1}
      - DATA_LAYER_DEBUG=${DATA_LAYER_DEBUG:-}

      # --- Authentication & chat persistence ---
      # CHAINLIT_AUTH_SECRET is loaded via env_file (.env.secrets) to avoid
      # ${} interpolation mangling values containing $ or special chars.
      # The app fail-fasts at startup if it is unset/empty
      # (see src/falkordb_harness/auth.py). Generate with: chainlit create-secret
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/chainlit.db}
      - ELEMENTS_DIR=${ELEMENTS_DIR:-./data/elements}
      - REGISTER_ENABLED=${REGISTER_ENABLED:-1}

      # --- Email (SMTP) ---
      # SMTP_PASSWORD is loaded via env_file (.env.secrets). The remaining
      # SMTP vars are non-secret config and passed explicitly here.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-1}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}

      # --- First admin bootstrap (idempotent on every restart) ---
      # FIRST_ADMIN_PASSWORD is loaded via env_file (.env.secrets).
      - FIRST_ADMIN_USERNAME=${FIRST_ADMIN_USERNAME:-}
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-}

    volumes:
      - ./data:/app/data
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      # Chainlit serves the UI on /. A 200 from the root path means the
      # HTTP server is up and serving.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  falkordb_data: