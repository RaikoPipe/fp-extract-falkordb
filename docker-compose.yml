services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data

  chainlit:
    build: .
    command: chainlit run src/falkordb_harness/chainlit_app.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=falkordb
    volumes:
      - ./data:/app/data
    depends_on:
      - falkordb

volumes:
  falkordb_data:
