[project]
name = "fp-extract-falkordb"
version = "0.1.0"
description = "Factory-planning knowledge graph extraction pipeline using FalkorDB"
requires-python = ">=3.10"
dependencies = [
    "falkordb>=1.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "unstructured[all-docs]",
    "json-repair",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
