[project]
name = "factory-kg-agent"
version = "2026.9.1"
description = "Factory-planning knowledge graph extraction pipeline using FalkorDB, with a LangChain deep-agent harness"
requires-python = ">=3.10"
dependencies = [
    "falkordb>=1.0.0",
    "openai>=2.0.0",
    # Bumped from >=2.0.0 → langgraph >= 1.2 requires pydantic >= 2.7.4
    "pydantic>=2.7.4",
    "python-dotenv>=1.0.0",
    "unstructured[all-docs]",
    "json-repair",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
    "loguru>=0.7.0",
    "langchain>=1.3.0,<2",
    "langchain-core>=1.4.7,<2",
    "langchain-anthropic>=1.0.0,<2",
    "langchain-openai>=1.4.0,<2",
    "langgraph>=1.2.0,<2",
    "deepagents>=0.7.0,<1",
    "docprep[ollama] @ file:src/document-to-markdown",
]

[project.optional-dependencies]
chainlit = [
    "chainlit>=2.0.0,<3",
    "anyio>=4.14.2",
    "starlette>=0.47.2",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "bcrypt>=4.0.0",
    "aiosmtplib>=3.0.0",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "reportlab>=4.0.0",
]
runner = [
    "docker>=7.0.0",
]

[project.scripts]
falkordb-agent = "falkordb_harness.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]