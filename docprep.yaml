# docprep configuration — Werma data, glm-ocr VLM fallback via Ollama

pipeline:
  vlm_preset: granite_docling
  ocr_languages: [en, de]           # Werma docs contain German text
  embed_images: false               # suppress base64; emit VLM text descriptions instead
  render_chart_images: true
  describe_images: true             # send images to VLM for two-stage processing
  picture_judge_prompt: "Look at this image and classify it as one of: \"text_only\" (the image contains only text that can be OCR'd) or \"needs_interpretation\" (the image contains charts, diagrams, figures, photos, or other visual elements). Respond with only the label, nothing else."
  picture_ocr_prompt: "Extract all text from this image. Preserve reading order, headings, and list structure. Output only the extracted text, no commentary."
  picture_interpret_prompt: "Convert this image to Markdown. Preserve all text, tables, and reading order. Describe any charts or figures in detail. Output only the Markdown content, no commentary."
  picture_description_timeout: 120
  picture_description_concurrency: 3
  picture_area_threshold: 0.01

quality_gate:
  min_text_density: 50
  max_garbled_ratio: 0.20

fallback:
  enabled: true
  provider: ollama
  model: minimax-m3:cloud                    # VLM model served by your Ollama endpoint
  base_url: https://ollama.com/v1   # <-- change to your remote Ollama host
  max_pages: 50
  timeout_seconds: 30

# MinerU backend — when enabled, bypasses Docling entirely and routes all
# supported inputs (PDF/DOCX/PPTX/XLSX/image) through MinerU. MinerU performs
# its own OCR (PP-OCRv6 for pipeline; native VLM OCR for vlm/hybrid) on
# scanned pages and image inputs, so image markdown references are stripped
# from the output (mineru.strip_images=true). VLM/hybrid backends also do
# image/chart interpretation, so the quality-gate VLM fallback above is
# skipped for those backends; pipeline-backend output may still escalate.
mineru:
  enabled: false
  backend: hybrid-engine          # pipeline | vlm-engine | hybrid-engine
  effort: medium                  # medium | high (hybrid-engine only)
  language: ch                    # pipeline OCR lang hint (PP-OCRv6 collapsed to "ch")
  parse_method: auto              # auto | txt | ocr (pipeline & hybrid only)
  formula_enable: true
  table_enable: true
  image_analysis: true            # vlm/hybrid only; hybrid medium auto-disables
  api_url:                        # blank = local subprocess; or http://host:8000 for mineru-api
  server_url:                     # required only for *-http-client backends
  start_page_id: 0
  end_page_id:                    # blank = parse to last page
  timeout_seconds: 600
  strip_images: true

# Set your real key before running:
#   export OLLAMA_API_KEY=sk-...